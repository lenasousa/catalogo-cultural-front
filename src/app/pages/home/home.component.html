<section class="home-container container">
  <h2>Catálogo Cultural - Destaques</h2>

  @if (eventos.length === 0) {
    <p>A carregar eventos do servidor...</p>
  } @else {
    <div class="cards-grid">
      @for (evento of eventos; track evento.id) {
        <app-card-evento [evento]="evento"></app-card-evento>
      }
    </div>
  }
</section>
