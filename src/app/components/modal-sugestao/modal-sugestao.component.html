@if (exibirModal) {
  <div class="modal show" style="display: block;">
    <div class="modal-content">
      <span class="close-button" (click)="fecharModal()">&times;</span>
      <h2>Sugerir Novo Espaço Cultural</h2>
      <p class="form-info">Campos marcados com * são obrigatórios</p>

      <form (ngSubmit)="submeterFormulario()">
        <div class="form-group">
          <label class="campo-obrigatorio">Nome do Espaço</label>
          <input type="text" [(ngModel)]="novoEvento.nome" name="nome" required>
        </div>

        <div class="form-group">
          <label class="campo-obrigatorio">Tipo</label>
          <select [(ngModel)]="novoEvento.tipo" name="tipo" required>
            <option value="">Selecione...</option>
            <option value="Exposição">Exposição</option>
            <option value="Festival">Festival</option>
            <option value="Museu">Museu</option>
            <option value="Teatro">Teatro</option>
            <option value="Cinema">Cinema</option>
            <option value="Show Musical">Show Musical</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label class="campo-obrigatorio">Bairro</label>
          <input type="text" [(ngModel)]="novoEvento.bairro" name="bairro" required>
        </div>

        <div class="form-group">
          <label class="campo-obrigatorio">Endereço Completo</label>
          <input type="text" [(ngModel)]="novoEvento.endereco" name="endereco" required>
        </div>

        <div class="form-group">
          <label class="campo-obrigatorio">Zona</label>
          <select [(ngModel)]="novoEvento.zona" name="zona" required>
            <option value="">Selecione...</option>
            <option value="Central">Central</option>
            <option value="Norte">Norte</option>
            <option value="Sul">Sul</option>
            <option value="Leste">Leste</option>
            <option value="Oeste">Oeste</option>
          </select>
        </div>

        <div class="form-group">
          <label class="campo-obrigatorio">Descrição</label>
          <textarea [(ngModel)]="novoEvento.descricao" name="descricao" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label>URL do Site (opcional)</label>
          <input type="url" [(ngModel)]="novoEvento.site" name="site">
        </div>

        <button type="submit" class="btn-enviar">Enviar Sugestão</button>
      </form>
    </div>
  </div>
}
